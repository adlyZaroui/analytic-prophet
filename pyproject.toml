[build-system]
# pybind11 is a *build* requirement now as well as a dev one: setup.py compiles
# `optimize.cpp` into the wheel, and needs its headers to do so (#97). The
# extension is optional -- a build without a compiler, Eigen or LBFGSpp still
# produces an installable package, and the core is compiled on first use as it
# always was (#108).
requires = ["setuptools>=61", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "analytic-prophet"
description = "Facebook Prophet's fitting engine with a hand-derived analytic gradient in place of Stan's automatic differentiation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adly Zaroui" }]
keywords = ["forecasting", "time-series", "prophet", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Exercised rather than implied: CI runs the whole suite on 3.9 through 3.14
# (#103), so this is a tested claim. It used to be reasoned from the source --
# old-style `typing.Tuple`, no walrus, no match statement, no PEP 604 unions --
# and building the matrix is what found the one thing that broke it, a
# `tomllib` import that arrived in 3.11.
requires-python = ">=3.9"

# **Floors, each set by a specific API this code calls** (#105). They were
# unbounded, which mattered more than it looks: every measured claim here is
# relative to the libraries installed beside it.
#
#   numpy    `np.random.default_rng`, which is 1.17. Every sampler here takes
#            a Generator rather than the legacy global functions.
#   pandas   nothing newer than 1.0 is called. prophet pulls >=1.3.5 of its
#            own accord, so the comparison runs above this anyway.
#   scipy    the two-argument `approx_fprime(x, f)`. `epsilon` became optional
#            in 1.9.0 -- its own docstring carries the `versionchanged` -- and
#            the numeric-gradient control calls it that way.
#
# scipy stays a required dependency although only `fit(backend="python")` uses
# it, so that backend works on a default install rather than behind an extra.
# It is *imported* lazily since #130 -- it was 57 of the 59 MiB this package
# added to an interpreter, which is a cost every user paid for a backend kept
# for reading against the C++ core. Moving it to an optional extra would cut
# the install too, and is a separate decision about whether the reference
# backend is part of the product.
#
# These are reasoned from the APIs, not tested below what CI resolves: pip
# gives each Python version the newest compatible release, which on 3.9 is far
# above every floor here. A floor that is wrong would therefore not fail the
# suite. Naming the deciding API for each is what makes it checkable by hand.
dependencies = [
    "numpy>=1.17",
    "pandas>=1.0",
    "scipy>=1.9",
]

# Version lives in analytic_prophet/__init__.py so there is one source of truth;
# tests/test_packaging.py checks that this file and that one cannot drift.
dynamic = ["version"]

[project.optional-dependencies]
# Country holidays (#16 task 9). Imported lazily and only by
# add_country_holidays -- trend, seasonality and a hand-written holidays frame
# all work without it, so a user who needs none of those needs none of this.
holidays = ["holidays"]

# `prophet` itself, deliberately not a runtime dependency. Every comparison
# against the original needs it, and it pulls cmdstanpy plus a compiled Stan
# model -- a toolchain heavier than everything else here combined. The suite is
# built to do without: conftest.py's prophet_comparison fixture skips when it is
# absent, and benchmark/_common.py prints an install hint rather than failing.
#
# **This is the bound that matters.** Every measured claim in this repository
# is relative to whatever Prophet is installed -- the posterior margin, the
# four-way prediction table, the 36-series accuracy result. A Prophet release
# could move the baselines and the suite would report the new numbers as fact
# with nothing looking wrong.
#
# 1.4.0 is what produced every committed result under evaluation/results; each
# tier's `.meta.json` records it, and tests/test_release_hygiene.py checks that
# this line and those files cannot drift apart. The floor is where
# `predict(vectorized=...)` arrives, which the four-way prediction comparison
# needs.
compare = ["prophet>=1.1.2"]

# pybind11 is a *build*-time dependency of the C++ core, not a runtime one:
# nothing imports it, but analytic_prophet/optimize.cpp cannot be compiled
# without its headers. It is here rather than in [build-system] because the
# extension is compiled on demand by conftest.py and the benchmarks, not at
# install time -- see [tool.setuptools.package-data] below.
#
# Eigen and LBFGSpp are header-only and come from the system, not from pip:
#     brew install eigen lbfgspp        # or equivalent
#
# `test` is what the suite needs *minus* the comparison against the original,
# and it is what CI installs on every matrix job (#103): prophet is the single
# largest cost in a run, so only the one agreement job pays for it.
test = [
    "analytic-prophet[holidays]",
    "pytest>=7",
    "pybind11",
    # tests/test_ci.py reads the workflow files, and tests/test_packaging.py
    # reads this one -- which needs tomli below 3.11, where tomllib arrived.
    # Without it the suite could not run on two of the versions
    # `requires-python` claims, which is the kind of thing a matrix is for.
    "pyyaml",
    "tomli; python_version < '3.11'",
    # evaluation/report.py draws the figures, and tests/test_evaluation_report.py
    # checks they were written. It had never been declared anywhere: prophet
    # depends on matplotlib, so it arrived with the comparison install and the
    # report tests passed for a reason nothing stated. Without prophet they
    # raised ModuleNotFoundError -- found by the first CI run (#103).
    "matplotlib",
]

dev = ["analytic-prophet[test,compare]"]

[project.urls]
Repository = "https://github.com/adlyZaroui/analytic-prophet"
Issues = "https://github.com/adlyZaroui/analytic-prophet/issues"

[tool.setuptools]
# Named rather than auto-discovered, so that adding a top-level directory --
# the evaluation suite that is coming next -- does not silently become part of
# the distribution. Splitting forecaster.py into submodules needs no change
# here: a package ships whatever modules it contains.
packages = ["analytic_prophet"]

[tool.setuptools.package-data]
# The C++ core ships as *source*. It is compiled on demand rather than at
# install time, which is deliberate: `pip install` then needs no C++ toolchain,
# no binary is checked in, and the tests that need one skip rather than fail.
# Building it at install time would mean a build backend that handles
# extensions and a compiler required of everyone -- worth revisiting if this is
# ever distributed, and not before.
# The licence texts of Eigen (MPL-2.0) and LBFGSpp (MIT) go in the same way.
# A binary wheel contains code compiled from both, so it has to carry their
# terms; neither is vendored, so tools/collect_licences.py puts them here at
# build time and this ships them (#97). The glob is empty in a source clone,
# which is why it is a glob.
analytic_prophet = ["optimize.cpp", "licences/*"]


[tool.cibuildwheel]
# Issue #97. Binary wheels are the only option that delivers what
# `pip install analytic-prophet` promises: the user needs no compiler, no
# Eigen and no LBFGSpp. The alternative -- a pure-Python wheel compiled on
# first use -- moves the toolchain requirement from install time to first fit
# rather than removing it.
#
# **Linux and macOS only, deliberately.** The suite has never run on Windows
# and `analytic_prophet/build.py` only knows Unix compilers, so a Windows
# wheel would ship for a platform nothing here has been tested on. Windows
# users get the sdist, which needs a compiler and says so.
#
# One target per version the test matrix runs, so `requires-python = ">=3.9"`
# names versions that are both built and tested. tests/test_packaging.py pins
# the two lists together -- a version added to CI and not here would be a
# claim with no wheel behind it.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build"

before-all = "bash tools/fetch_headers.sh && python tools/collect_licences.py"

# Where the fetch put them. `analytic_prophet.build`'s finders read exactly
# these two variables, so the wheel build and the on-demand build look in the
# same place by the same rule.
[tool.cibuildwheel.environment]
AP_HEADERS = "/tmp/ap-headers"
EIGEN_INCLUDE_DIR = "/tmp/ap-headers/eigen"
LBFGSPP_INCLUDE_DIR = "/tmp/ap-headers/lbfgspp/include"
EIGEN_VERSION = "3.4.0"
LBFGSPP_VERSION = "v0.3.0"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.setuptools.dynamic]
version = { attr = "analytic_prophet.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# So a fresh clone can run `pytest` with no install and no PYTHONPATH. An
# editable install makes the first entry redundant but not wrong; the second is
# the Prophet-comparison plumbing, which lives with the benchmarks because that
# is also where it is exercised interactively.
pythonpath = [".", "benchmark", "evaluation"]
