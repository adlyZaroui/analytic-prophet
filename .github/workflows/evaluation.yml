# The evaluation suite, deliberately not per-push.
#
# #103: the tiers do not belong in the push workflow. Tier 2 alone is about
# eleven minutes and downloads the M4 corpus, so running it on every commit
# would make the suite slow and network-dependent for no gain -- its results
# are *committed*, and the point of re-running them is to compare against what
# is written down.
#
# So this is manual (or monthly), and it uploads the regenerated results as an
# artifact rather than committing them: refreshing the committed numbers is a
# decision someone makes after reading the diff, not something a cron job does
# to the repository. Tier 0 is a gate -- `evaluation/run.py` exits non-zero
# when the two implementations are not fitting the same model, which fails the
# job before any measurement is reported.
name: evaluation

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: 'which tiers to run, space separated (blank = all)'
        required: false
        default: ''
  schedule:
    # 04:00 UTC on the first of the month.
    - cron: '0 4 1 * *'

permissions:
  contents: read

env:
  LBFGSPP_VERSION: v0.3.0
  EIGEN_INCLUDE_DIR: /usr/include/eigen3

jobs:
  evaluate:
    name: run the tiers and regenerate the report
    runs-on: ubuntu-latest
    # Tier 2 is the long one; the whole run is minutes to hours by design.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libeigen3-dev

      - name: Fetch LBFGSpp headers
        run: |
          git clone --depth 1 --branch "$LBFGSPP_VERSION" \
            https://github.com/yixuan/LBFGSpp.git "$RUNNER_TEMP/LBFGSpp"

      - name: Install the package, with prophet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # Before the tiers, not after: the corpus is pre-registered, so a run
      # against a manifest that no longer matches its own rule is a run whose
      # numbers describe an unknown set of series (#164). Three minutes here
      # is cheaper than discovering it from the results.
      - name: Verify the frozen corpus still reproduces
        run: python evaluation/freeze_corpus.py

      - name: Run the tiers
        env:
          LBFGSPP_INCLUDE_DIR: ${{ runner.temp }}/LBFGSpp/include
          # through the environment rather than interpolated into the shell:
          # `${{ }}` is expanded before bash sees the script, so a dispatch
          # input spliced in there would be a command-injection seam.
          TIERS: ${{ github.event.inputs.tiers }}
        run: |
          if [ -n "$TIERS" ]; then
            python evaluation/run.py --tiers $TIERS   # deliberately word-split
          else
            python evaluation/run.py
          fi

      - name: Regenerate the report
        env:
          LBFGSPP_INCLUDE_DIR: ${{ runner.temp }}/LBFGSpp/include
        run: python evaluation/report.py

      - name: Show what moved
        if: always()
        run: |
          {
            echo '### changes against the committed results'
            echo ''
            echo '```diff'
            git diff --stat -- evaluation/results || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evaluation/results
          if-no-files-found: error
