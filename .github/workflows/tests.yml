# The suite, on every push and every pull request.
#
# #103: before this, every green run of the suite had been someone running
# pytest on their own machine. Nothing checked a push, and nothing would have
# noticed if main broke.
#
# The one thing this must not do is report green for a run that skipped the
# half that matters. The C++ core is compiled on demand and its tests *skip*
# when the toolchain is absent, which is right on a laptop and wrong here --
# so every job installs the headers and passes `--require-cpp`, which turns
# those skips into failures. Whatever is still skipped is printed, grouped by
# reason, into the job summary.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # LBFGSpp is header-only and is not packaged by apt, so it is cloned.
  # Pinned: an unpinned clone would make a green run depend on the day.
  LBFGSPP_VERSION: v0.3.0
  # Eigen from apt lands here, which is already in conftest.py's candidate
  # list -- set explicitly so a change there cannot quietly start a skip.
  EIGEN_INCLUDE_DIR: /usr/include/eigen3

jobs:
  suite:
    # The matrix is what gives `requires-python = ">=3.9"` any basis: until
    # this existed, the suite had only ever run on one version (#103).
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libeigen3-dev

      - name: Fetch LBFGSpp headers
        run: |
          git clone --depth 1 --branch "$LBFGSPP_VERSION" \
            https://github.com/yixuan/LBFGSpp.git "$RUNNER_TEMP/LBFGSpp"
          test -f "$RUNNER_TEMP/LBFGSpp/include/LBFGSB.h"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run the suite
        env:
          LBFGSPP_INCLUDE_DIR: ${{ runner.temp }}/LBFGSpp/include
        run: |
          set -o pipefail
          pytest -q -rs --require-cpp | tee "$RUNNER_TEMP/pytest.out"

      - name: Report what was skipped
        if: always()
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          {
            echo "### python $PYTHON_VERSION"
            echo ''
            echo '```'
            if grep -q 'skipped, by reason' "$RUNNER_TEMP/pytest.out"; then
              sed -n '/skipped, by reason/,$p' "$RUNNER_TEMP/pytest.out"
            else
              echo 'nothing was skipped'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  agreement:
    # The one job that pays for prophet. It pulls cmdstanpy and a compiled
    # Stan model, which is the single largest cost in a CI run, so it is not
    # charged to all six matrix jobs -- and `--require-prophet` makes sure the
    # job that does pay actually ran the comparisons rather than skipping them.
    #
    # The price of that decision, measured: 196 of the suite's tests need
    # prophet, so each matrix job runs about 574 of them and this job runs all
    # of them. The matrix is answering "does it work on this Python", and this
    # job is answering "does it still agree with the original". If the split
    # ever looks like the wrong trade, the skip report on every matrix job is
    # where the number comes from.
    #
    # It runs the whole suite rather than a hand-picked subset: a `-k`
    # expression would be one more thing to keep in step with the test names,
    # and the comparison tests are spread across files rather than marked.
    name: agreement against prophet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Not the newest: prophet's wheels and its cmdstan dependency are
          # the constraint here, not this package.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libeigen3-dev

      - name: Fetch LBFGSpp headers
        run: |
          git clone --depth 1 --branch "$LBFGSPP_VERSION" \
            https://github.com/yixuan/LBFGSpp.git "$RUNNER_TEMP/LBFGSpp"

      - name: Install the package, with prophet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run the suite, requiring both
        env:
          LBFGSPP_INCLUDE_DIR: ${{ runner.temp }}/LBFGSpp/include
        run: |
          set -o pipefail
          pytest -q -rs --require-cpp --require-prophet | tee "$RUNNER_TEMP/pytest.out"

      - name: Report what was skipped
        if: always()
        run: |
          {
            echo '### agreement against prophet'
            echo ''
            echo '```'
            if grep -q 'skipped, by reason' "$RUNNER_TEMP/pytest.out"; then
              sed -n '/skipped, by reason/,$p' "$RUNNER_TEMP/pytest.out"
            else
              echo 'nothing was skipped'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
