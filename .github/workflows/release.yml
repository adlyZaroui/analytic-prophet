# Wheels, built from a tag, verified, and published only when a human says so.
#
# Issue #97. `pip install analytic-prophet` has to work on a machine with no
# compiler, which means binary wheels: the package compiles its C++ core on
# first use otherwise, and moving a toolchain requirement from install time to
# first-fit time is not removing it.
#
# **This workflow does not publish on its own.** The upload job targets a
# GitHub environment named `pypi`, and an environment with a required reviewer
# will not run until that reviewer approves it. Until the PyPI side is set up
# -- the name registered and a trusted publisher configured -- the job simply
# never runs, and the wheels are still built, tested and attached to the run as
# artifacts. That is deliberate: publishing is irreversible and is the
# maintainer's to do.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is one runner, not two. `[tool.cibuildwheel.macos]` asks for
        # both architectures, and cibuildwheel cross-compiles the x86_64 wheel
        # on the arm64 runner -- the v0.1.0 attempt proved it, building all ten
        # macosx wheels (x86_64 and arm64, cp39-cp313) on macos-14 alone.
        #
        # The macos-13 leg it used to carry was therefore redundant *and*
        # fatal: GitHub has retired the Intel runner image, so the job sat
        # queued with no runner for the whole run. `verify` needs `wheels` and
        # `publish` needs `verify`, so one unschedulable leg blocked the
        # release permanently rather than failing it visibly.
        #
        # The cross-compiled x86_64 wheels cannot be executed on an arm64
        # runner, so cibuildwheel does not test them. They are built and
        # audited, not run.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The matrix, the headers and the licences all come from
      # [tool.cibuildwheel] in pyproject.toml, so there is one place to read
      # and no second copy here to drift.
      # v2 predates CPython 3.14: the v0.1.0 attempt built cp39-cp313 and
      # silently nothing for cp314, while `requires-python = ">=3.9"` and the
      # test matrix both claim it. The `verify` job below now checks the built
      # set against the configured one rather than trusting either.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    # What the acceptance criteria actually ask: that an installed wheel runs
    # the *compiled* core, rather than silently falling back to building one.
    # A wheel that compiles on first use would pass a plain import test.
    name: verify the wheels
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      # The check that would have caught cp314 going missing. `pyproject.toml`
      # names the interpreters to build; this asserts the wheels that came out
      # cover every one of them, for every platform the matrix ran. A config
      # listing cp314 proves nothing if the tool that reads it is too old to
      # know what cp314 is -- which is exactly what happened to v0.1.0.
      - name: Every configured Python must have a wheel
        run: |
          python - <<'PY'
          import glob, re, sys, tomllib

          with open("pyproject.toml", "rb") as handle:
              configured = tomllib.load(handle)["tool"]["cibuildwheel"]["build"]
          wanted = set(re.findall(r"cp(\d+)-", configured))

          built = sorted(glob.glob("wheelhouse/*.whl"))
          assert built, "no wheels were downloaded"

          missing = {}
          for platform in ("manylinux", "macosx_11_0_arm64", "macosx_10_"):
              have = {m.group(1) for name in built
                      if platform in name
                      for m in [re.search(r"-cp(\d+)-", name)] if m}
              absent = wanted - have
              if absent:
                  missing[platform] = sorted(absent)

          for name in built:
              print("  ", name.split("/")[-1])
          assert not missing, (
              f"configured to build {sorted(wanted)} but missing: {missing}")
          print(f"\nall of {sorted(wanted)} built for every platform")
          PY

      - name: Install the Linux wheel somewhere with no toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/*manylinux*x86_64.whl

      - name: It must run the compiled core, not build one
        env:
          # an empty cache: if anything compiles at runtime, it lands here and
          # the check below fails
          ANALYTIC_PROPHET_CACHE: ${{ runner.temp }}/empty-cache
        run: |
          cd "$RUNNER_TEMP"          # away from the checkout, or it shadows the install
          python - <<'PY'
          import os
          import pandas as pd
          import analytic_prophet
          from analytic_prophet import AnalyticProphet, load_cpp_module

          package = os.path.dirname(analytic_prophet.__file__)
          assert "site-packages" in package, package

          core = load_cpp_module().__file__
          assert core.startswith(package), f"the core came from {core}, not the wheel"

          frame = pd.DataFrame({
              "ds": pd.date_range("2015-01-01", periods=200),
              "y": range(200),
          })
          AnalyticProphet().fit(frame).predict(
              AnalyticProphet().fit(frame).make_future_dataframe(periods=5))

          cache = os.environ["ANALYTIC_PROPHET_CACHE"]
          assert not os.path.isdir(cache), (
              f"something was compiled at runtime into {cache}; the wheel's "
              f"extension was not used")
          print("the wheel ships a working compiled core")
          PY

      - name: The wheel must carry the third-party licences
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("wheelhouse/*manylinux*x86_64.whl"))[0]
          names = zipfile.ZipFile(wheel).namelist()
          for wanted in ("licences/LICENSE.eigen", "licences/LICENSE.lbfgspp",
                         "licences/NOTICE"):
              assert any(n.endswith(wanted) for n in names), f"{wanted} is missing"
          assert any(n.endswith(".so") for n in names), "no compiled core in the wheel"
          print("licences and core present")
          PY

  publish:
    # Gated. `environment: pypi` is where a required reviewer is configured, so
    # this waits for approval however the workflow was triggered. Nothing here
    # runs until the name is registered and a trusted publisher is set up.
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/analytic-prophet
    permissions:
      id-token: write          # trusted publishing; no API token in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
